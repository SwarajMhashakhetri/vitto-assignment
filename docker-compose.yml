services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lds
      POSTGRES_PASSWORD: lds_password
      POSTGRES_DB: lending
    ports:
      # Host port 5433 to avoid colliding with a Postgres already running on
      # the default port. Inside the compose network it is still 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lds -d lending']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://lds:lds_password@postgres:5432/lending?schema=public
      MONGO_URL: mongodb://mongo:27017/lending_audit
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      DECISION_PROCESSING_DELAY_MS: 1200
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker-entry.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lds:lds_password@postgres:5432/lending?schema=public
      MONGO_URL: mongodb://mongo:27017/lending_audit
      REDIS_URL: redis://redis:6379
      DECISION_PROCESSING_DELAY_MS: 1200
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
