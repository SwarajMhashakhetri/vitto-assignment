# Render Blueprint.
#
# Provisions the API, Postgres and a Redis (Key Value) instance.
#
# There is deliberately no `type: worker` service here: Render's free plan does
# not offer background workers. Instead the API runs with
# DECISION_MODE=embedded, which hosts the BullMQ worker inside the API process
# — a real queue with real retries and backoff, just sharing an event loop.
# On a paid plan, split it back out by adding a worker service running
# `node dist/worker-entry.js` and setting DECISION_MODE=queue on both.
#
# MongoDB is not here either: Render has no managed MongoDB. Set MONGO_URL to
# an Atlas connection string in the dashboard. The audit trail is best-effort,
# so the API serves decisions without it.

services:
  - type: web
    name: lending-api
    runtime: node
    plan: free
    region: singapore
    # `--include=dev` is load-bearing. NODE_ENV=production is set below and is
    # visible during the build, and npm ci honours it by omitting
    # devDependencies — which is where TypeScript and every @types/* package
    # live. Without this the build either cannot find `tsc` at all or picks up
    # whatever TypeScript the build image happens to ship, which is how this
    # first failed. Compiling is a dev-time activity even in a production
    # deploy.
    buildCommand: npm ci --include=dev && npm run build --workspace @lds/shared && npm run build --workspace @lds/api
    # Migrations run before the server binds, so an instance never starts
    # against a schema that does not match its code.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned: Render's default Node version changes over time, and the build
      # should not start failing because of a platform default moving.
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: lending-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lending-redis
          property: connectionString
      # Set manually in the dashboard: MongoDB Atlas connection string.
      - key: MONGO_URL
        sync: false
      # Set manually to the deployed frontend origin, e.g.
      # https://vitto-assignment.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: DECISION_MODE
        value: embedded
      # No artificial delay in production; it exists only to make the polling
      # flow visible during a local demo.
      - key: DECISION_PROCESSING_DELAY_MS
        value: '0'

  - type: redis
    name: lending-redis
    plan: free
    region: singapore
    # BullMQ needs keys to survive memory pressure; evicting a queued job
    # would silently lose an application.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: lending-postgres
    plan: free
    region: singapore
    databaseName: lending
    user: lds
