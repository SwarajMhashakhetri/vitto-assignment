server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path is handled by the client, so serve
    # index.html rather than a 404. Without this a refresh on any route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    # index.html must not be, or clients would never see a new deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
